name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c constraints.txt -e '.[dev]'
      - run: python -m pytest -q
      - run: ruff check src tests scripts setup_device.py
      - run: ruff format --check src tests scripts setup_device.py
  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/relay.test.mjs
        working-directory: cloud
      - run: node scripts/build.mjs
        working-directory: cloud
      - run: node scripts/validate-artifact.mjs
        working-directory: cloud
