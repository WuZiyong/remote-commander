[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-commander"
version = "0.1.0"
description = "Self-hosted multi-device MCP file and process tools"
requires-python = ">=3.11"
dependencies = ["mcp>=1.28,<2", "psutil>=6,<8", "httpx>=0.28,<1", "uvicorn>=0.34,<1", "python-dotenv>=1,<2", "cryptography>=46,<51"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
remote-commander = "remote_commander.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
